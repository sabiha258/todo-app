# ============================================================
# CI/CD Pipeline for To-Do App
# Triggered on every push to main or pull request
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ──────────────────────────────────────────
  # STAGE 1: CI — Build & Test
  # ──────────────────────────────────────────
  build-and-test:
    name: 🔧 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🧪 Run Tests
        run: npm test

      - name: 📊 Upload Coverage Report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/

  # ──────────────────────────────────────────
  # STAGE 2: CD — Deploy (only on main branch)
  # ──────────────────────────────────────────
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build-and-test           # Only runs if build-and-test passes
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 📦 Install Production Dependencies
        run: npm install --production

      - name: ✅ Verify App Starts
        run: |
          node src/app.js &
          sleep 3
          curl -f http://localhost:3000/ || exit 1
          kill %1

      - name: 🎉 Deployment Successful
        run: |
          echo "==========================================="
          echo " ✅ App deployed successfully!"
          echo " 🌐 App is live and healthy"
          echo " 📦 Version: ${{ github.sha }}"
          echo "==========================================="
